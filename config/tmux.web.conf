# 仅在 USE_TMUX=1 时使用；尽量少干扰全屏 TUI（Claude Code 等）
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -ag terminal-overrides ",*256col*:Tc"
set -sg escape-time 0
set -g aggressive-resize on
# 必须 off：mouse on 时滚轮经公网会卡。
# alternate-screen on：让 Claude/Cursor Agent 等 TUI 走备用屏，重连时只重绘一屏，
# 避免在普通 buffer 里灌几百行——看起来像「从顶部滚动」。
# 普通 shell 刷屏仍可进入浏览器 scrollback（应用未开备用屏时）。
set -g mouse off
set -g status off
set -g focus-events on
setw -g alternate-screen on
set -g history-limit 50000

# 更深历史：
#   Shift+PgUp / Shift+PgDn  — tmux copy-mode
#   Ctrl-b [                 — 手动 copy-mode；q 退出
bind -n S-PPage copy-mode -u
bind -n S-NPage if -F '#{pane_in_mode}' 'send-keys -X page-down' 'send-keys Pagedown'

# 应用（Claude Code / vim 等）用 OSC 52 写剪贴板时，转发给外层终端（浏览器）。
# 浏览器侧由 web/wt-copy.js 的 OSC 52 处理器接住并写入客户端剪贴板；
# 若这里设成 off，应用会提示「已复制」但浏览器剪贴板其实没变。
set -g set-clipboard external
