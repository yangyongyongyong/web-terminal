[Service]
# 会话进程（claude、构建任务等）都跑在本 unit 的 cgroup 里，
# 所以这里的限制 = 「所有网页终端会话的总额度」。
#
# 2026-11-11 故障：会话里一个 go build 吃到 972MB，叠加 3 个 claude 与 gateway，
# 3.8G 内存打满触发全局 OOM，内核按 cgroup 选了本 unit 的进程。
# 与其让内核在全局范围挑受害者，不如把压力关在本 unit 内：
#   MemoryHigh  → 软限制：超过后内核回收该 cgroup 的页，进程变慢但不被杀
#   MemoryMax   → 硬限制：超过才 OOM，且只在 unit 内挑进程（配合 OOMPolicy=continue，
#                 不会连带停服或杀掉别的服务）
#   MemorySwapMax → 限制本 unit 能吃多少 swap，避免一个会话把 swap 吃光拖垮整机
#
# 机型 3.8G 内存：gateway(740M) + caddy + v2ray + 系统约 1.3G，
# 给会话留 2.5G 内存 + 1.5G swap。要跑更大的构建可调高这里。
MemoryHigh=2G
MemoryMax=2500M
MemorySwapMax=1500M
