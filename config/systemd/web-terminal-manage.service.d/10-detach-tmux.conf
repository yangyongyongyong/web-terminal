[Service]
# tmux server 是由 manage 服务派生的（manage-server.py → session-ctl.sh → tmux new-session），
# 因此落在本 unit 的 cgroup 里。systemd 默认 KillMode=control-group + OOMPolicy=stop 意味着：
#   1) 任何会话里跑爆内存 → 内核 OOM 杀进程 → systemd 判定 unit 失败 → 杀掉整个 cgroup
#      → tmux server 被杀 → 所有 wt-* 会话瞬间消失。
#   2) systemctl restart/stop 本服务也会连带杀掉所有会话。
# 改为只杀主进程、OOM 不牵连同 unit 其它进程，让 tmux 会话与 Web 服务生命周期解耦。
KillMode=process
OOMPolicy=continue
